version: '3.9'
services:
  user-service:
    image: user-service-image
    build: .
    container_name: user-service

    ports:
      - "8810:8810"
    restart: always
    environment:
      - TZ=Asia/Tashkent
      - JVM_OPTS=-Xmx1024m -Xms256m
    command: [ "java", "-Djasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}", "-Duser.timezone=Asia/Tashkent", "-jar", "/app/app.jar" ]
    networks:
      - paymo
networks:
  paymo:
    name: paymo
    external: true
