version: '3.9'
services:
  chat:
    image: chat
    build: .
    container_name: chat
    ports:
      - "8716:8716"
    restart: always
    environment:
      - TZ=Asia/Tashkent
      - JVM_OPTS=-Xmx1024m -Xms256m
      - SPRING_PROFILES_ACTIVE=${CI_COMMIT_REF_NAME}
    command: [ "java", "-Djasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}", "-Duser.timezone=Asia/Tashkent", "-jar", "app.jar" ]
    networks:
      - paymo
networks:
  paymo:
    name: paymo
    external: true
