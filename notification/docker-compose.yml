version: '3.8'
services:
  notification:
    image: notification
    build: .
    ports:
      - "8717-8719:8717"
    environment:
      - SERVER_PORT=8717
      - TZ=Asia/Tashkent
      - JVM_OPTS=-Xmx512m -Xms256m
    command: [ "java", "-Djasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}", "-jar", "app.jar" ]
    deploy:
      mode: replicated
      replicas: 3
    restart: always

    networks:
      - paymo

networks:
  paymo:
    name: paymo
    external: true