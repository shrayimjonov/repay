version: '3.8'
services:
  app:
    image: log-image
    build: .
    container_name: log-protocol-service
    ports:
      - "8750:8750"
    restart: always
    environment:
      - TZ=Asia/Tashkent
      - JVM_OPTS=-Xmx512m -Xms256m
    command: [ "java", "-Djasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}", "-jar", "app.jar" ]
    networks:
      - paymo
networks:
  paymo:
    name: paymo
    external: true

