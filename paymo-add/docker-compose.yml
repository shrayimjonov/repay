version: '3.7'
services:
  paymo_add:
    image: paymo_add
    build: .
    container_name: paymo_add-app
    ports:
      - "8667:8667"
    restart: always
    environment:
      - TZ=Asia/Tashkent
      - JVM_OPTS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=${CI_COMMIT_REF_NAME}
    command: [ "java", "-jar", "app.war" ]
    networks:
      - gateway
networks:
  gateway:
    name: gateway
    external: true
